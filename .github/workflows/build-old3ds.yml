name: Build 0.2.8-old3ds (test)
on:
  push:
    branches: [ci/build-0.2.8-old3ds]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 60
    steps:
      - name: Tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates make
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap
        run: |
          git config --global --add safe.directory '*'
          python3 --version
          python3 tools/bootstrap.py --dir build/old3ds
      - name: Build old3ds
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          cd build/old3ds/3ds_port
          set -o pipefail
          make CLEAN_RELEASE=1 CTR_FORCE_OLD3DS=1 TWIN_EMBERS_VERSION=0.2.8-old3ds verify-game-3dsx 2>&1 | tee $GITHUB_WORKSPACE/build.log
          sha256sum twinembers.3dsx | tee SHA256SUMS.txt
      - name: Publish output to branch ci/build-output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          cp $GITHUB_WORKSPACE/build.log . 2>/dev/null || echo "no log" > build.log
          tail -c 3000000 build.log > b && mv b build.log
          cp $GITHUB_WORKSPACE/build/old3ds/3ds_port/twinembers.3dsx $GITHUB_WORKSPACE/build/old3ds/3ds_port/SHA256SUMS.txt . 2>/dev/null || true
          git init -q -b ci/build-output . && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "build output ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/build-output
